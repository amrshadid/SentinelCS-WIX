<!doctype html>
<meta charset="utf-8">
<!-- Run with `npm test`. Loads the built element file and checks it in a real browser. -->
<sentinel-header></sentinel-header>
<div style="height:3000px"></div>
<sentinel-footer></sentinel-footer>
<pre id="result">RUNNING</pre>
<script src="../src/public/custom-elements/sentinel-header.js"></script>
<script src="../src/public/custom-elements/sentinel-footer.js"></script>
<script>
const lines = [];
const check = (name, passed) => lines.push(`${passed ? 'PASS' : 'FAIL'} ${name}`);
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

const CONFIG = {
  brand: { name: 'Acme Imaging', homeUrl: '/start' },
  header: {
    nav: [
      { label: 'One', url: '/one' },
      { label: '<img src=x onerror=window.INJECTED=1>', url: '/two' },
      { label: 'Docs', url: 'https://example.com', newTab: true },
    ],
    signIn: { label: 'My account', url: '/account', newTab: false },
    cta: { label: 'Talk to us', shortLabel: 'Talk', url: '/contact' },
  },
  footer: {
    tag: 'TAG X', headline: 'Head one', headlineEmphasis: 'Head two', invitation: 'Line A\nLine B',
    cta: { label: 'Go now', url: '/contact' }, caption: 'Cap', brandCopy: 'Brand A\nBrand B',
    product: { label: 'PROD', sub: 'Sub text', url: '/prod' },
    columns: [
      { title: 'Col1', links: [{ label: 'L1', url: '/l1' }, { label: 'L2', url: '/l2', demo: true }] },
      { title: 'Col2', links: [{ label: 'Out', url: 'https://x.test', newTab: true }], text: 'Paragraph here' },
    ],
    legal: 'Legal A\nLegal B',
  },
};

(async () => {
  try {
    const header = document.querySelector('sentinel-header');
    const footer = document.querySelector('sentinel-footer');
    await wait(200);
    const hs = header.root;
    const fs = footer.root;

    // Skeleton, before any config
    check('both elements render', !!hs.querySelector('.header') && !!fs.querySelector('footer'));
    check('footer year is current', fs.querySelector('.year').textContent === String(new Date().getFullYear()));
    check('header starts expanded', header.getAttribute('compact') !== 'true');

    // Header: its own fixed layer, and the scroll behaviour of the reference design
    check('header draws in a fixed layer on the page', !!header.layer && header.layer.parentElement === document.body && getComputedStyle(header.layer).position === 'fixed');
    check('header box reserves its height', header.style.height === '108px');
    window.scrollTo(0, 400);
    window.dispatchEvent(new Event('scroll'));
    check('scrolling down makes the header compact', header.getAttribute('compact') === 'true' && hs.querySelector('.header').classList.contains('is-compact'));
    await wait(900);
    const bar = hs.querySelector('.header').getBoundingClientRect();
    check('header stays fixed at the top while scrolled', scrollY > 300 && Math.abs(bar.top - 16) < 2);
    check('header is what sits at the top of the screen', document.elementFromPoint(innerWidth / 2, 40) === header.layer);
    check('compact header is centered', Math.abs(hs.querySelector('.header').getBoundingClientRect().left - (innerWidth - hs.querySelector('.header').getBoundingClientRect().right)) < 2);
    window.scrollTo(0, 60);
    window.dispatchEvent(new Event('scroll'));
    check('stays compact in the hysteresis band', header.getAttribute('compact') === 'true');
    window.scrollTo(0, 0);
    window.dispatchEvent(new Event('scroll'));
    check('scrolling back to the top expands it', header.getAttribute('compact') === 'false');
    header.setAttribute('compact-at', '500');
    window.scrollTo(0, 400);
    window.dispatchEvent(new Event('scroll'));
    check('compact-at setting moves the threshold', header.getAttribute('compact') === 'false');
    window.scrollTo(0, 0);
    window.dispatchEvent(new Event('scroll'));
    header.removeAttribute('compact-at');
    hs.querySelector('.mobile-toggle').click();
    check('mobile menu opens', hs.querySelector('.header').classList.contains('menu-open'));
    check('menu toggle reports expanded', hs.querySelector('.mobile-toggle').getAttribute('aria-expanded') === 'true');
    hs.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Escape closes the menu', !hs.querySelector('.header').classList.contains('menu-open'));
    hs.querySelector('.mobile-toggle').click();
    document.body.click();
    check('outside click closes the menu', !hs.querySelector('.header').classList.contains('menu-open'));

    // The page may scroll inside a container instead of the window (as Wix pages can)
    const scroller = document.createElement('div');
    scroller.id = 'page-scroller';
    scroller.style.cssText = 'position:absolute;top:0;left:0;width:200px;height:200px;overflow:auto';
    scroller.innerHTML = '<div style="height:3000px"></div>';
    document.body.append(scroller);
    scroller.scrollTop = 500;
    scroller.dispatchEvent(new Event('scroll'));
    check('scrolling inside a container makes the header compact', header.getAttribute('compact') === 'true');
    footer.setAttribute('smooth-scroll', 'false');
    fs.querySelector('.back').click();
    check('back to top also scrolls that container', scroller.scrollTop === 0);
    window.scrollTo(0, 400);
    fs.querySelector('.back').click();
    check('back to top scrolls the window', window.scrollY === 0);
    scroller.dispatchEvent(new Event('scroll'));
    header.setAttribute('compact', 'false');
    scroller.remove();
    footer.removeAttribute('smooth-scroll');

    // Theme
    hs.querySelector('.theme-toggle').click();
    check('toggle makes the header dark', header.getAttribute('theme') === 'dark');
    check('footer follows the header theme', footer.getAttribute('theme') === 'dark');
    check('theme is remembered', localStorage.getItem('sentinel-theme') === 'dark');
    check('toggle label reflects the theme', hs.querySelector('.theme-toggle').getAttribute('aria-label') === 'Switch to light theme');
    const late = document.createElement('sentinel-header');
    document.body.prepend(late);
    await wait(100);
    check('a new element starts in the saved theme', late.getAttribute('theme') === 'dark');
    late.remove();
    check('removing a header removes its layer', !document.querySelector('.sentinel-header-layer + .sentinel-header-layer') && document.querySelectorAll('.sentinel-header-layer').length === 1);

    // Inline mode stays inside the Wix box
    const inline = document.createElement('sentinel-header');
    inline.setAttribute('mode', 'inline');
    document.body.append(inline);
    await wait(100);
    check('mode="inline" keeps the header in the element box', !inline.layer && !!inline.shadowRoot.querySelector('.header'));
    inline.remove();

    // Content from config
    header.setAttribute('current-path', '/one');
    header.setAttribute('config', JSON.stringify(CONFIG));
    footer.setAttribute('config', JSON.stringify(CONFIG));
    await wait(100);
    const navLinks = hs.querySelectorAll('.navigation > a:not(.mobile-extra)');
    check('header nav comes from config', navLinks.length === 3 && navLinks[0].getAttribute('href') === '/one');
    check('current page is marked', navLinks[0].getAttribute('aria-current') === 'page');
    check('CMS text cannot inject HTML', !window.INJECTED && !hs.querySelector('.navigation img'));
    check('markup-like label is shown as text', navLinks[1].textContent.includes('<img'));
    check('external link opens safely in a new tab', navLinks[2].target === '_blank' && navLinks[2].rel === 'noopener');
    check('sign-in link from config', hs.querySelector('.login').textContent.trim().startsWith('My account') && hs.querySelector('.login').getAttribute('href') === '/account');
    check('call-to-action labels', hs.querySelector('.cta .long-label').textContent === 'Talk to us' && hs.querySelector('.cta .short-label').textContent === 'Talk');
    check('brand name and home link', hs.querySelector('.brand').getAttribute('aria-label') === 'Acme Imaging home' && hs.querySelector('.brand').getAttribute('href') === '/start');
    let announced = null;
    header.addEventListener('sentinel-navigate', (event) => { announced = event.detail; });
    hs.querySelector('.cta').click();
    check('call to action announces its Wix url', announced && announced.key === 'demo' && announced.url === '/contact');

    check('footer text from config', fs.querySelector('.tag').textContent === 'TAG X' && fs.querySelector('h2 em').textContent === 'Head two');
    check('footer keeps line breaks', fs.querySelectorAll('.invitation br').length === 1 && fs.querySelectorAll('.brand-copy br').length === 1);
    check('footer columns come from config', fs.querySelectorAll('.column').length === 2 && fs.querySelector('.column h3').textContent === 'Col1');
    check('column paragraph and demo link', fs.querySelectorAll('.column')[1].querySelector('p').textContent === 'Paragraph here' && fs.querySelectorAll('.column')[0].querySelectorAll('a')[1].hasAttribute('data-demo'));
    check('product badge from config', fs.querySelector('.product-badge').textContent.includes('PROD') && fs.querySelector('.product-badge').getAttribute('href') === '/prod');
    check('legal text keeps a live year', fs.querySelector('.bottom > span').textContent.includes(String(new Date().getFullYear())) && fs.querySelector('.bottom > span').textContent.includes('Legal B'));

    // Settings typed in the Wix editor win over the CMS content
    header.setAttribute('cta-label', 'Editor label');
    header.setAttribute('brand-name', 'Editor brand');
    await wait(50);
    check('editor attribute overrides the CMS label', hs.querySelector('.cta .long-label').textContent === 'Editor label');
    check('editor brand name is applied', hs.querySelector('.brand').getAttribute('aria-label') === 'Editor brand home');
    header.removeAttribute('cta-label');
    header.removeAttribute('brand-name');

    // Robustness
    header.setAttribute('config', '{not json');
    check('invalid config is ignored', hs.querySelectorAll('.navigation > a:not(.mobile-extra)').length === 3);
    header.remove();
    check('removing an element does not throw', true);
  } catch (error) {
    lines.push(`ERROR ${error.message}`);
  }
  document.getElementById('result').textContent = `${lines.join('\n')}\nDONE`;
})();
</script>
